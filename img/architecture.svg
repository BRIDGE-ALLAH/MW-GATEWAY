<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc"><title id="title">Moonwitness Gateway architecture</title><desc id="desc">AI applications and agents connect through Moonwitness Gateway to configured model providers, MCP tool servers, A2A peers and HTTP services. Security policy and observability are cross-cutting responsibilities.</desc><defs><linearGradient id="g"><stop stop-color="#9D4EDD"/><stop offset=".5" stop-color="#00D4FF"/><stop offset="1" stop-color="#FFD400"/></linearGradient><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#00D4FF"/></marker></defs><rect width="1280" height="620" rx="20" fill="#07060B"/><text x="60" y="65" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="3">MOONWITNESS GATEWAY / REQUEST FLOW</text><text x="60" y="96" fill="#9E96B0" font-family="Inter,Arial,sans-serif" font-size="14">Illustrative architecture — configured capabilities vary by deployment</text><rect x="60" y="170" width="260" height="235" rx="15" fill="#13101D" stroke="#514068" stroke-width="2"/><text x="88" y="210" fill="#FFD400" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">CLIENTS</text><text x="88" y="260" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Applications</text><text x="88" y="302" fill="#B8AEC8" font-family="Inter,Arial,sans-serif" font-size="17">AI agents</text><text x="88" y="336" fill="#B8AEC8" font-family="Inter,Arial,sans-serif" font-size="17">Agent frameworks</text><text x="88" y="370" fill="#B8AEC8" font-family="Inter,Arial,sans-serif" font-size="17">Internal services</text><path d="M322 285H445" stroke="url(#g)" stroke-width="4" marker-end="url(#ar)"/><rect x="455" y="145" width="370" height="285" rx="18" fill="#171020" stroke="#9D4EDD" stroke-width="2.5"/><text x="640" y="210" text-anchor="middle" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="850">MOONWITNESS</text><text x="640" y="242" text-anchor="middle" fill="#FFD400" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="850" letter-spacing="5">GATEWAY</text><g font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle"><rect x="490" y="280" width="145" height="46" rx="8" fill="#281D39" stroke="#9D4EDD"/><text x="562" y="309" fill="#E8D4FF">ROUTING</text><rect x="650" y="280" width="145" height="46" rx="8" fill="#30280D" stroke="#FFD400"/><text x="722" y="309" fill="#FFE989">POLICY</text><rect x="490" y="345" width="145" height="46" rx="8" fill="#102C34" stroke="#00D4FF"/><text x="562" y="374" fill="#B6F2FF">AUTH</text><rect x="650" y="345" width="145" height="46" rx="8" fill="#35162A" stroke="#FF007A"/><text x="722" y="374" fill="#FFC1DF">OBSERVABILITY</text></g><path d="M828 285H950" stroke="url(#g)" stroke-width="4" marker-end="url(#ar)"/><rect x="960" y="170" width="260" height="235" rx="15" fill="#13101D" stroke="#514068" stroke-width="2"/><text x="988" y="210" fill="#00D4FF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">DESTINATIONS</text><text x="988" y="260" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="750">LLM providers</text><text x="988" y="302" fill="#B8AEC8" font-family="Inter,Arial,sans-serif" font-size="17">MCP tool servers</text><text x="988" y="336" fill="#B8AEC8" font-family="Inter,Arial,sans-serif" font-size="17">A2A peers</text><text x="988" y="370" fill="#B8AEC8" font-family="Inter,Arial,sans-serif" font-size="17">HTTP services</text><rect x="60" y="475" width="1160" height="82" rx="12" fill="#100D17" stroke="#514068"/><text x="90" y="520" fill="#FFD400" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="850" letter-spacing="2">GOVERNED OPERATIONS</text><text x="350" y="520" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="15">Authentication</text><circle cx="485" cy="515" r="4" fill="#FF007A"/><text x="510" y="520" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="15">Authorization</text><circle cx="650" cy="515" r="4" fill="#00D4FF"/><text x="675" y="520" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="15">Guardrails</text><circle cx="795" cy="515" r="4" fill="#FFD400"/><text x="820" y="520" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="15">Metrics · Logs · Traces</text><text x="90" y="543" fill="#9E96B0" font-family="Inter,Arial,sans-serif" font-size="11">Only controls and integrations configured for the running deployment apply.</text></svg>